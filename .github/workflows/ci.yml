name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kickoff rule 3: CI never reaches the live API. Fixtures only.
  LIVE_API: '0'

jobs:
  # ---------------------------------------------------------------- lint + types + unit
  check:
    name: lint / typecheck / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit + integration tests (fixture mode)
        run: pnpm test
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-replay-only
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ci-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-service

  # ---------------------------------------------------------------- migrations
  migrations:
    name: migrations apply to a fresh database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase and apply migrations
        run: supabase start
      - name: Schema introspection (F1 VT)
        run: pnpm test:schema
      # The `check` job runs `pnpm test` with placeholder keys and no database, so every
      # integration VT skips there. This is the job that actually exercises them (F8 quota,
      # budget cap, log sink; F12 owner gate and admin views). The keys below are the fixed
      # Supabase CLI demo keys every local `supabase start` produces - public by design and
      # useless off 127.0.0.1.
      - name: Integration tests against the local database (F8 / F12 VTs)
        run: pnpm test:int
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-replay-only
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - if: always()
        run: supabase stop

  # ---------------------------------------------------------------- guardrails gate
  # GUARDRAILS.md s6: any regression in the red-team corpus pass criteria blocks merge.
  guardrails:
    name: guardrail corpus (blocks merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:guardrails
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-replay-only
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ci-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-service

  # ---------------------------------------------------------------- e2e
  e2e:
    name: e2e (fixture mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-replay-only
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ci-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-service
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------- known external gaps
  # Allowed to fail. Reports a dependency we are waiting on the owner for, so it stays
  # visible on every run without blocking unrelated work. See test/blocked/README.md.
  blocked-on-owner:
    name: blocked on owner (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: blocked
        continue-on-error: true
        run: pnpm test:blocked
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-replay-only
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ci-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-service
      - name: Summarize
        if: steps.blocked.outcome == 'failure'
        run: |
          echo "### Blocked on the owner" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`test/blocked\` is failing: a dependency outside the team's control is missing." >> "$GITHUB_STEP_SUMMARY"
          echo "Currently: the four **reference stories** were not in the handover archive." >> "$GITHUB_STEP_SUMMARY"
          echo "This blocks master-prompt style anchors and judge calibration (and so the F13 eval gate)." >> "$GITHUB_STEP_SUMMARY"
          echo "See \`storytime-plan/reference-stories/README.md\`." >> "$GITHUB_STEP_SUMMARY"
