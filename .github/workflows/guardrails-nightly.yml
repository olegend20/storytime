name: Guardrail corpus (nightly, live)

# GUARDRAILS.md s7: "live mode nightly via scheduled workflow, results uploaded".
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  live-corpus:
    name: red-team corpus against the live classifier
    runs-on: ubuntu-latest
    environment: eval
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:guardrails
        env:
          LIVE_API: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardrail-corpus-results
          path: test/guardrails/results/
          retention-days: 30
